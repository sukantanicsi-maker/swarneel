<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Stock & Expense Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f9;
      color: #222;
    }

    h1 {
      margin: 0 0 30px 0;
      font-size: 32px;
      color: #17202a;
    }

    /* Summary boxes */
    .summary-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    .summary-box {
      padding: 25px 30px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    }

    .expenditure-box {
      background: #fdeaea;
      border-left: 6px solid #e57373;
    }

    .credit-box {
      background: #e8f7ee;
      border-left: 6px solid #4caf70;
    }

    .summary-title {
      font-size: 16px;
      color: #555;
      margin-bottom: 10px;
    }

    .summary-value {
      font-size: 34px;
      font-weight: bold;
    }

    .expenditure-box .summary-value {
      color: #c0392b;
    }

    .credit-box .summary-value {
      color: #168044;
    }

    /* Individual cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .card {
      background: white;
      padding: 28px 25px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    }

    .card-title {
      font-size: 15px;
      color: #666;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .card-value {
      font-size: 29px;
      font-weight: bold;
      color: #14854f;
    }

    .status {
      margin-top: 25px;
      font-size: 14px;
      color: #555;
    }

    .refresh-btn {
      margin-top: 18px;
      padding: 11px 22px;
      border: none;
      border-radius: 8px;
      background: #1677ff;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    .refresh-btn:hover {
      background: #0d63d8;
    }

    /* Mobile */
    @media (max-width: 900px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .summary-container {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 20px;
      }

      h1 {
        font-size: 26px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .summary-value {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <h1>Stock & Expense Dashboard</h1>

  <!-- SUMMARY -->
  <div class="summary-container">

    <div class="summary-box expenditure-box">
      <div class="summary-title">TOTAL EXPENDITURE</div>
      <div class="summary-value" id="totalExpenditure">
        ₹0.00
      </div>
    </div>

    <div class="summary-box credit-box">
      <div class="summary-title">TOTAL CREDIT</div>
      <div class="summary-value" id="totalCredit">
        ₹0.00
      </div>
    </div>

  </div>


  <!-- INDIVIDUAL TOTALS -->
  <div class="cards">

    <div class="card">
      <div class="card-title">Total Buy</div>
      <div class="card-value" id="totalBuying">₹0.00</div>
    </div>

    <div class="card">
      <div class="card-title">Cash Credit</div>
      <div class="card-value" id="totalCashFlow">₹0.00</div>
    </div>

    <div class="card">
      <div class="card-title">Employee</div>
      <div class="card-value" id="totalEmployee">₹0.00</div>
    </div>

    <div class="card">
      <div class="card-title">Cooking</div>
      <div class="card-value" id="totalCooking">₹0.00</div>
    </div>

    <div class="card">
      <div class="card-title">Miscellaneous</div>
      <div class="card-value" id="totalMisc">₹0.00</div>
    </div>

    <div class="card">
      <div class="card-title">Supro Cars</div>
      <div class="card-value" id="totalSuproCars">₹0.00</div>
    </div>

  </div>


  <div class="status" id="status"></div>

  <button class="refresh-btn" onclick="loadAllData()">
    Refresh Data
  </button>


  <script>

    /* ==============================
       GOOGLE SHEET
    ============================== */

    const SHEET_ID = "1MSDmtDcmmKTt6ykUQh9XOnq0tfsipn2A";


    /* ==============================
       SHEET SOURCES
    ============================== */

    const sources = [

      {
        sheet: "Buying",
        column: "Buying_Price",
        element: "totalBuying"
      },

      {
        sheet: "Cash_Flows",
        column: "Amount_Credit",
        element: "totalCashFlow"
      },

      {
        sheet: "Employee",
        column: "Amount",
        element: "totalEmployee"
      },

      {
        sheet: "Cooking",
        column: "Amount",
        element: "totalCooking"
      },

      {
        sheet: "MISC",
        column: "Amount",
        element: "totalMisc"
      },

      {
        sheet: "Supro_Cars",
        column: "Amount",
        element: "totalSuproCars"
      }

    ];


    /* ==============================
       FORMAT NUMBER
    ============================== */

    function formatCurrency(value) {

      return "₹" + Number(value).toLocaleString("en-IN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

    }


    /* ==============================
       GET TOTAL FROM GOOGLE SHEET
    ============================== */

    async function getSheetTotal(sheetName, columnName) {

      const url =
        "https://docs.google.com/spreadsheets/d/" +
        SHEET_ID +
        "/gviz/tq?tqx=out:json&sheet=" +
        encodeURIComponent(sheetName);

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error("Unable to access " + sheetName);
      }

      const text = await response.text();

      /* Google GViz returns wrapped JSON */
      const jsonText =
        text.substring(
          text.indexOf("{"),
          text.lastIndexOf("}") + 1
        );

      const data = JSON.parse(jsonText);

      if (
        !data.table ||
        !data.table.cols
      ) {
        throw new Error("Invalid data from " + sheetName);
      }


      /* Find required column */
      let columnIndex = -1;

      for (let i = 0; i < data.table.cols.length; i++) {

        const label =
          data.table.cols[i].label || "";

        if (
          label.trim().toLowerCase() ===
          columnName.trim().toLowerCase()
        ) {
          columnIndex = i;
          break;
        }

      }


      if (columnIndex === -1) {
        throw new Error(
          columnName +
          " column not found in " +
          sheetName
        );
      }


      /* Calculate total */
      let total = 0;

      for (const row of data.table.rows) {

        if (!row.c || !row.c[columnIndex]) {
          continue;
        }

        let value =
          row.c[columnIndex].v;

        if (typeof value === "string") {

          value = value
            .replace(/[₹,$\s]/g, "")
            .replace(/,/g, "");

        }

        const number =
          parseFloat(value);

        if (!isNaN(number)) {
          total += number;
        }

      }

      return total;

    }


    /* ==============================
       LOAD ALL DATA
    ============================== */

    async function loadAllData() {

      const status =
        document.getElementById("status");

      status.textContent =
        "Loading data...";


      try {

        const results =
          await Promise.all(

            sources.map(async (source) => {

              const total =
                await getSheetTotal(
                  source.sheet,
                  source.column
                );

              return {
                ...source,
                total: total
              };

            })

          );


        /* Individual values */

        results.forEach(item => {

          document.getElementById(
            item.element
          ).textContent =
            formatCurrency(item.total);

        });


        /* ==============================
           TOTAL CREDIT
           = Cash Credit
        ============================== */

        const cashCredit =
          results.find(
            item =>
              item.sheet === "Cash_Flows"
          )?.total || 0;

        document.getElementById(
          "totalCredit"
        ).textContent =
          formatCurrency(cashCredit);


        /* ==============================
           TOTAL EXPENDITURE
           
           Buying
           + Employee
           + Cooking
           + Miscellaneous
           + Supro Cars
        ============================== */

        const totalExpenditure =
          results
            .filter(item =>
              [
                "Buying",
                "Employee",
                "Cooking",
                "MISC",
                "Supro_Cars"
              ].includes(item.sheet)
            )
            .reduce(
              (sum, item) =>
                sum + item.total,
              0
            );


        document.getElementById(
          "totalExpenditure"
        ).textContent =
          formatCurrency(totalExpenditure);


        status.textContent =
          "Data updated successfully.";

      }

      catch (error) {

        console.error(error);

        status.textContent =
          "Error: " + error.message;

      }

    }


    /* ==============================
       INITIAL LOAD
    ============================== */

    loadAllData();

  </script>

</body>
</html>
