<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stock Dashboard</title>

<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        background: #f4f6f9;
        padding: 30px;
    }

    .container {
        max-width: 1100px;
        margin: auto;
    }

    h1 {
        color: #222;
        margin-bottom: 25px;
    }

    .card {
        background: white;
        width: 320px;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .card-title {
        color: #777;
        font-size: 16px;
        margin-bottom: 12px;
    }

    .total {
        font-size: 34px;
        font-weight: bold;
        color: #198754;
    }

    .status {
        margin-top: 20px;
        color: #666;
    }

    button {
        margin-top: 20px;
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        background: #0d6efd;
        color: white;
        cursor: pointer;
    }
</style>
</head>

<body>

<div class="container">

    <h1>Stock Dashboard</h1>

    <div class="card">

        <div class="card-title">
            TOTAL BUY
        </div>

        <div class="total" id="totalBuy">
            ₹0.00
        </div>

    </div>

    <div class="status" id="status">
        Loading...
    </div>

    <button onclick="loadBuyingData()">
        Refresh
    </button>

</div>


<script>

const SHEET_ID =
"1MSDmtDcmmKTt6ykUQh9XOnq0tfsipn2A";

const SHEET_NAME =
"Buying";

const PRICE_COLUMN =
"Buying_Price";


async function loadBuyingData() {

    const status =
        document.getElementById("status");

    status.innerText = "Loading data...";

    try {

        // Google Sheet URL
        const url =
        "https://docs.google.com/spreadsheets/d/" +
        SHEET_ID +
        "/gviz/tq?tqx=out:json&sheet=" +
        encodeURIComponent(SHEET_NAME);


        const response =
            await fetch(url);

        const text =
            await response.text();


        // Convert Google response to JSON
        const start =
            text.indexOf("{");

        const end =
            text.lastIndexOf("}") + 1;

        const json =
            text.substring(start, end);

        const data =
            JSON.parse(json);


        // Get columns
        const columns =
            data.table.cols;


        // Get rows
        const rows =
            data.table.rows;


        // ----------------------------------
        // FIND Buying_Price COLUMN
        // ----------------------------------

        let priceColumnIndex = -1;

        for (
            let i = 0;
            i < columns.length;
            i++
        ) {

            const columnName =
                (columns[i].label || "")
                .trim();

            if (
                columnName.toLowerCase() ===
                PRICE_COLUMN.toLowerCase()
            ) {

                priceColumnIndex = i;

                break;
            }
        }


        // Column not found
        if (priceColumnIndex === -1) {

            status.innerText =
                "Buying_Price column not found.";

            console.log(
                "Columns found:",
                columns
            );

            return;
        }


        // ----------------------------------
        // TOTAL BUYING PRICE
        // ----------------------------------

        let totalBuy = 0;


        for (
            let i = 0;
            i < rows.length;
            i++
        ) {

            const cell =
                rows[i].c[priceColumnIndex];


            if (
                !cell ||
                cell.v === null ||
                cell.v === undefined
            ) {
                continue;
            }


            let value =
                cell.v;


            // Convert to text
            value =
                String(value);


            // Remove currency symbols,
            // commas and spaces
            value =
                value.replace(
                    /[₹,$\s]/g,
                    ""
                );


            const price =
                parseFloat(value);


            if (!isNaN(price)) {

                totalBuy =
                    totalBuy + price;

            }
        }


        // ----------------------------------
        // SHOW TOTAL ON DASHBOARD
        // ----------------------------------

        document.getElementById(
            "totalBuy"
        ).innerText =
            "₹" +
            totalBuy.toLocaleString(
                "en-IN",
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            );


        status.innerText =
            "Buying data loaded successfully.";


    }
    catch (error) {

        console.error(error);

        status.innerText =
            "Error loading Google Sheet.";

    }
}


// Automatically load when page opens
loadBuyingData();

</script>

</body>
</html>
