<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Dashboard</title>
<style>
:root {
    --forest: #2f6b4a;
    --forest-2: #ffffff;
    --leaf: #3d9a65;
    --sage: #9ccdae;
    --mint: #e3f4e8;
    --paper: #f3faf4;
    --card: #ffffff;
    --line: #d3e9da;
    --ink: #17261e;
    --muted: #5f7468;
    /* ADJUST HERE: Expenditure cards (red) */
    --spend: #d32f2f;
    --spend-bg: #fdecec;
    --spend-line: #f5b5b5;
    /* ADJUST HERE: Credit cards (green) */
    --credit: #1f9d55;
    --credit-bg: #e3f6ea;
    --credit-line: #a9dcbc;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI", Roboto, Arial, sans-serif; background: var(--paper); color: var(--ink); }
.num { font-variant-numeric: tabular-nums; }

/* TOP BAND */
.top { background: linear-gradient(180deg, #cfeadb 0%, #e3f4e8 100%); color: var(--ink); padding: 26px 20px 70px; border-bottom: 1px solid var(--line); }
.wrap { max-width: 1300px; margin: 0 auto; }
.top h1 { font-size: 26px; font-weight: 650; letter-spacing: .2px; color: var(--forest); }
.top p { color: var(--muted); font-size: 14px; margin-top: 4px; }

/* FILTER */
.filter-box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
.filter { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.fg { display: flex; flex-direction: column; gap: 5px; }
.fg label { font-size: 12px; color: var(--muted); }
select, input[type=date] {
    height: 40px; min-width: 190px; padding: 0 11px; border-radius: 8px; font-size: 14px;
    border: 1px solid #b8dac6; background: #fff; color: var(--ink); outline: none;
}
select:focus, input:focus, button:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }
input[type=date] { color-scheme: light; }
#dateRange, #stockDateRange { display: none; gap: 10px; flex-wrap: wrap; }
button {
    height: 40px; padding: 0 22px; border: 0; border-radius: 8px; cursor: pointer;
    background: var(--leaf); color: #fff; font-size: 14px; font-weight: 600;
}
button:hover { background: #33865a; }
#selectedPeriod, #stockSelected { margin-top: 12px; font-size: 13px; color: var(--muted); }
#selectedPeriod strong, #stockSelected strong { color: var(--forest); font-weight: 600; }

/* MAIN */
main { margin-top: -50px; padding: 0 20px 30px; }
.sec { margin-bottom: 30px; }
.sec-title { font-size: 17px; font-weight: 650; margin: 0 0 14px; padding: 11px 18px; border-radius: 10px; background: var(--leaf); color: #fff; box-shadow: 0 3px 10px rgba(61,154,101,.25); }

.hero { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 14px; }
.big { border-radius: 14px; padding: 16px 20px; min-height: 96px; display: flex; flex-direction: column; justify-content: center; border: 1px solid var(--line); background: var(--card); box-shadow: 0 6px 18px rgba(47,107,74,.10); }
.big .t { font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
.big .v { font-size: 34px; font-weight: 800; }
.big.spend { background: var(--spend-bg); border-color: var(--spend-line); }
.big.spend .v { color: var(--spend); }
.big.credit { background: var(--credit-bg); border-color: var(--credit-line); }
.big.credit .v { color: var(--credit); }

.grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-height: 80px; display: flex; flex-direction: column; justify-content: center; }
.kpi .t { font-size: 13.5px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
.kpi .v { font-size: 21px; font-weight: 800; }
/* Item Stock: all text bold */
#stockSection, #stockSection * { font-weight: 700; }
#stockSection .item-name, #stockSection .item-row b { font-weight: 800; }
/* Item Stock cards */
.item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.item-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.item-name { font-size: 15px; font-weight: 800; color: var(--forest); padding-bottom: 8px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
.item-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--ink); }
.item-row b { font-size: 18px; font-weight: 800; text-align: right; }
.item-row.amt b { color: var(--spend); }
.stock-note { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.stock-empty { background: var(--card); border: 1px dashed var(--line); border-radius: 10px; padding: 18px; color: var(--muted); font-size: 14px; text-align: center; }
#stockError { background: #fee2e2; color: #991b1b; }
/* Cash Credit card (light blue) - ADJUST HERE */
.kpi.credit { background: #e8f3fc; border-color: #b9d9f2; }
.kpi.credit .v { color: #1e6fb8; }

.msg { border-radius: 10px; padding: 14px; font-size: 14px; margin-top: 16px; white-space: pre-line; display: none; }
#error { background: #fee2e2; color: #991b1b; }
#warning { background: #fef3c7; color: #854d0e; }
#loading { display: block; text-align: center; color: var(--muted); }
#success { text-align: center; color: var(--leaf); font-size: 13px; }
.footer { text-align: center; color: var(--muted); font-size: 12px; padding-bottom: 24px; }

@media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } }
@media (max-width: 650px) {
    .top { padding: 20px 14px 70px; }
    main { padding: 0 14px 24px; }
    .filter { flex-direction: column; align-items: stretch; }
    select, input[type=date], button { width: 100%; }
    #dateRange, #stockDateRange { flex-direction: column; }
    .big .v { font-size: 28px; }
    .big .t { font-size: 14px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 9px; }
    .kpi { min-height: 74px; padding: 10px 12px; }
    .kpi .v { font-size: 18px; }
    .kpi .t { font-size: 13px; }
}
@media (max-width: 360px) { .grid { grid-template-columns: 1fr; } }

/* =====================================================
   MOBILE RESPONSIVE (added)
===================================================== */
html { -webkit-text-size-adjust: 100%; }
body { overflow-x: hidden; }
.item-name, .item-row b, .kpi .v, .big .v { overflow-wrap: anywhere; }

/* Tablet */
@media (max-width: 900px) {
    .item-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    .sec-title { font-size: 16px; }
}

/* Phone */
@media (max-width: 650px) {
    .top { padding: 18px 14px 64px; }
    .top h1 { font-size: 21px; }
    .top p { font-size: 13px; }

    .sec { margin-bottom: 22px; }
    .sec-title { font-size: 15px; padding: 10px 14px; margin-bottom: 10px; border-radius: 8px; }

    .filter-box { padding: 12px; margin-bottom: 10px; }
    .fg { width: 100%; }
    select, input[type=date] { min-width: 0; width: 100%; font-size: 16px; height: 44px; }   /* 16px stops iOS zoom */
    button { height: 44px; width: 100%; }
    #selectedPeriod, #stockSelected { font-size: 12px; line-height: 1.4; }

    .hero { gap: 10px; margin-bottom: 10px; }
    .big { min-height: 82px; padding: 14px 16px; }

    .item-grid { grid-template-columns: 1fr; gap: 9px; }
    .item-card { padding: 11px 13px; }
    .item-name { font-size: 15px; }
    .item-row { font-size: 13px; flex-wrap: wrap; }
    .item-row b { font-size: 17px; }
    .stock-note { font-size: 11px; line-height: 1.4; }

    .msg { font-size: 13px; padding: 12px; }
    .footer { font-size: 11px; }
}

/* Small phones */
@media (max-width: 380px) {
    main { padding: 0 10px 20px; }
    .top { padding-left: 10px; padding-right: 10px; }
    .big .v { font-size: 25px; }
    .kpi .t { font-size: 12px; }
    .kpi .v { font-size: 16px; }
}
</style>
</head>

<body>

<div class="top">
  <div class="wrap">
    <h1>Expense Dashboard</h1>
    <p>Live data from Google Sheets</p>

  </div>
</div>

<main>
  <div class="wrap">

    <div class="sec">
      <div class="sec-title">Overall Summary</div>
      <div class="hero" id="overallHero"></div>
      <div class="grid" id="overallGrid"></div>
    </div>

    <div class="sec">
      <div class="sec-title">Selected Period Summary</div>
      <div class="filter-box">
    <div class="filter">
    <div class="fg">
      <label for="periodSelect">Select period</label>
      <select id="periodSelect">
        <option value="lastDate">Last Date Entry</option>
        <option value="last7">Last 7 Days</option>
        <option value="last15">Last 15 Days</option>
        <option value="range">Date Range</option>
      </select>
    </div>
    <div id="dateRange">
      <div class="fg"><label for="fromDate">From date</label><input type="date" id="fromDate"></div>
      <div class="fg"><label for="toDate">To date</label><input type="date" id="toDate"></div>
    </div>
    <button id="applyBtn">Apply</button>
  </div>
  <div id="selectedPeriod">Selected period: <strong>Loading...</strong></div>
      </div>
      <div class="hero" id="periodHero"></div>
      <div class="grid" id="periodGrid"></div>
    </div>

    <div class="sec" id="stockSection">
      <div class="sec-title">Item Stock</div>
      <div class="filter-box">
        <div class="filter">
          <div class="fg">
            <label for="stockItem">Item</label>
            <select id="stockItem"><option value="__all">All Items</option></select>
          </div>
          <div class="fg">
            <label for="stockPeriod">Select period</label>
            <select id="stockPeriod">
              <option value="all">All Dates</option>
              <option value="lastDate">Last Date Entry</option>
              <option value="last7">Last 7 Days</option>
              <option value="last15">Last 15 Days</option>
              <option value="range">Date Range</option>
            </select>
          </div>
          <div id="stockDateRange">
            <div class="fg"><label for="stockFrom">From date</label><input type="date" id="stockFrom"></div>
            <div class="fg"><label for="stockTo">To date</label><input type="date" id="stockTo"></div>
          </div>
          <button id="stockApply">Apply</button>
        </div>
        <div id="stockSelected">Selected period: <strong>Loading...</strong></div>
      </div>
      <div class="stock-note" id="stockNote"></div>
      <div class="item-grid" id="stockGrid"></div>
      <div class="msg" id="stockError"></div>
    </div>

    <div id="loading" class="msg">Loading data from Google Sheets...</div>
    <div id="success" class="msg">Data loaded successfully.</div>
    <div id="warning" class="msg"></div>
    <div id="error" class="msg"></div>
  </div>
</main>

<div class="footer">Data is fetched directly from Google Sheets</div>

<script>
const SPREADSHEET_ID = "1SXWgzfINs6TGt3G-AF25-O_TJq0xYsRPQns_P0x5xFs";

const SHEETS = {
    Buying:     "2093020950",
    Cash_Flows: "2100593426",
    Employee:   "1620505158",
    Cooking:    "1987654808",
    MISC:       "1505058386",
    Supro_Cars: "1580668395"
};

/* Range B4:D -> index 0 = Date (B), index 2 = Amount (D) */
const DATE_INDEX = 0, AMOUNT_INDEX = 2;

/* Breakdown cards: [sheet key, label, is credit] */
const ITEMS = [
    ["Buying", "Total Buy"], ["Employee", "Employee"], ["Cooking", "Cooking"],
    ["MISC", "Miscellaneous"], ["Supro_Cars", "Supro Cars"], ["Cash_Flows", "Cash Credit", true]
];

let allData = {};
Object.keys(SHEETS).forEach(k => allData[k] = []);
let cb = 0;

/* ---------- build card markup ---------- */
function buildSection(prefix) {
    document.getElementById(prefix + "Hero").innerHTML =
        '<div class="big spend"><div class="t">' + (prefix === "period" ? "Period" : "Total") + ' Expenditure</div><div class="v num" id="' + prefix + 'Exp">₹0</div></div>' +
        '<div class="big credit"><div class="t">' + (prefix === "period" ? "Period" : "Total") + ' Credit</div><div class="v num" id="' + prefix + 'Cr">₹0</div></div>';

    document.getElementById(prefix + "Grid").innerHTML = ITEMS.map(it =>
        '<div class="kpi' + (it[2] ? " credit" : "") + '"><div class="t">' + it[1] + '</div>' +
        '<div class="v num" id="' + prefix + it[0] + '">₹0</div></div>'
    ).join("");
}
buildSection("period");
buildSection("overall");

/* ---------- Google Sheets loader (no query) ---------- */
function loadSheetData(name, gid, opts) {
    return new Promise((resolve, reject) => {
        const fn = "gviz_" + (++cb);
        let script, timer, finished = false;

        function end(err, data) {
            if (finished) return;
            finished = true;
            clearTimeout(timer);
            delete window[fn];
            if (script && script.parentNode) script.parentNode.removeChild(script);
            err ? reject(err) : resolve(data);
        }

        window[fn] = function (res) {
            try {
                if (!res) return end(new Error(name + ": Empty response."));
                if (res.status && res.status !== "ok") {
                    let m = name + ": Google Sheets returned an error.";
                    if (res.errors && res.errors.length)
                        m += "\n" + res.errors.map(e => e.detailed_message || e.message || "").join("\n");
                    return end(new Error(m));
                }
                const rws = res.table && res.table.rows ? res.table.rows : [];
                rws.cols = res.table && res.table.cols ? res.table.cols : [];
                end(null, rws);
            } catch (e) { end(e); }
        };

        const p = new URLSearchParams();
        const o = opts || {};
        if (o.sheet) p.set("sheet", o.sheet); else p.set("gid", gid);
        p.set("range", o.range || "B4:D");
        p.set("headers", o.headers === undefined ? "0" : String(o.headers));
        p.set("tqx", "out:json;responseHandler:" + fn);

        script = document.createElement("script");
        script.src = "https://docs.google.com/spreadsheets/d/" + SPREADSHEET_ID + "/gviz/tq?" + p.toString();
        script.async = true;
        script.onerror = () => end(new Error(name + ": Could not connect to Google Sheets.\nCheck: Share → Anyone with the link → Viewer"));
        timer = setTimeout(() => end(new Error(name + ": Request timed out.")), 20000);
        document.head.appendChild(script);
    });
}

/* ---------- parsing ---------- */
function parseDate(value, formatted) {
    if (typeof value === "string") {
        const m = value.match(/^Date\((\d+),\s*(\d+),\s*(\d+)/);
        if (m) return new Date(+m[1], +m[2], +m[3]);
    }
    for (const c of [formatted, value]) {
        if (c === null || c === undefined || c === "") continue;
        const m = String(c).trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
        if (m) {
            let y = +m[3]; if (y < 100) y += 2000;
            const d = +m[1], mo = +m[2] - 1;
            if (mo < 0 || mo > 11 || d < 1 || d > 31) continue;
            return new Date(y, mo, d);
        }
    }
    return null;
}

function parseAmount(v) {
    if (v === null || v === undefined || v === "") return 0;
    if (typeof v === "number") return v;
    const n = parseFloat(String(v).replace(/₹/g, "").replace(/,/g, "").trim());
    return isNaN(n) ? 0 : n;
}

const dateOnly = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const pad = n => String(n).padStart(2, "0");
const showDate = d => pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear();
const inputDate = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());

async function loadOneSheet(name, gid) {
    const rows = await loadSheetData(name, gid);
    const out = [];
    rows.forEach(r => {
        if (!r || !r.c) return;
        const dc = r.c[DATE_INDEX], ac = r.c[AMOUNT_INDEX];
        if (!dc) return;
        const d = parseDate(dc.v, dc.f);
        if (!d) return;
        out.push({ date: dateOnly(d), amount: ac ? parseAmount(ac.v) : 0 });
    });
    return out;
}

/* ---------- range + totals ---------- */
function getLatestDate() {
    let latest = null;
    Object.values(allData).forEach(list => list.forEach(r => {
        if (!latest || r.date > latest) latest = dateOnly(r.date);
    }));
    return latest;
}

function getSelectedRange() {
    const sel = document.getElementById("periodSelect").value;
    const latest = getLatestDate();
    if (!latest) throw new Error("No valid date was found in Google Sheets.");

    if (sel === "lastDate")
        return { from: latest, to: latest, label: "Last Date Entry — " + showDate(latest) };

    if (sel === "last7" || sel === "last15") {
        const days = sel === "last7" ? 7 : 15;
        const from = new Date(latest);
        from.setDate(from.getDate() - (days - 1));
        return { from: dateOnly(from), to: latest, label: "Last " + days + " Days — " + showDate(from) + " to " + showDate(latest) };
    }

    const fv = document.getElementById("fromDate").value;
    const tv = document.getElementById("toDate").value;
    if (!fv || !tv) throw new Error("Please select both From Date and To Date.");
    const f = fv.split("-").map(Number), t = tv.split("-").map(Number);
    const from = new Date(f[0], f[1] - 1, f[2]), to = new Date(t[0], t[1] - 1, t[2]);
    if (from > to) throw new Error("From Date cannot be later than To Date.");
    return { from, to, label: "Date Range — " + showDate(from) + " to " + showDate(to) };
}

function calculateTotals(range) {
    const totals = {};
    Object.keys(allData).forEach(k => {
        totals[k] = 0;
        allData[k].forEach(r => {
            if (r.date >= range.from && r.date <= range.to) totals[k] += r.amount;
        });
    });
    return totals;
}

const rupee = v => (Number(v) < 0 ? "−₹" : "₹") + Math.abs(Number(v) || 0).toLocaleString("en-IN", { maximumFractionDigits: 2 });

function updateCards(prefix, t) {
    const exp = t.Buying + t.Employee + t.Cooking + t.MISC + t.Supro_Cars;
    const cr = t.Cash_Flows;

    document.getElementById(prefix + "Exp").textContent = rupee(exp);
    document.getElementById(prefix + "Cr").textContent = rupee(cr);

    ITEMS.forEach(it => {
        const key = it[0];
        document.getElementById(prefix + key).textContent = rupee(t[key]);
    });
}

/* ---------- UI actions ---------- */
function applyFilter() {
    const err = document.getElementById("error");
    try {
        err.style.display = "none";
        const range = getSelectedRange();
        updateCards("period", calculateTotals(range));
        document.getElementById("selectedPeriod").innerHTML = "Selected period: <strong>" + range.label + "</strong>";
    } catch (e) {
        err.style.display = "block";
        err.textContent = e.message;
    }
}

function handlePeriodChange() {
    document.getElementById("dateRange").style.display =
        document.getElementById("periodSelect").value === "range" ? "flex" : "none";
}

async function loadDashboard() {
    const $ = id => document.getElementById(id);
    try {
        $("loading").style.display = "block";
        ["success", "warning", "error"].forEach(i => $(i).style.display = "none");

        const names = Object.keys(SHEETS);
        const settled = await Promise.allSettled(names.map(n => loadOneSheet(n, SHEETS[n])));
        const failed = [];

        settled.forEach((r, i) => {
            if (r.status === "fulfilled") allData[names[i]] = r.value;
            else { allData[names[i]] = []; failed.push(r.reason && r.reason.message ? r.reason.message : names[i] + ": Unknown error"); }
        });

        if (failed.length === names.length) throw new Error(failed.join("\n\n"));

        updateCards("overall", calculateTotals({ from: new Date(2000, 0, 1), to: new Date(2100, 11, 31) }));

        const latest = getLatestDate();
        if (!latest) throw new Error("No valid date was found in Google Sheets.");

        $("fromDate").value = inputDate(latest);
        $("toDate").value = inputDate(latest);
        $("periodSelect").value = "lastDate";
        handlePeriodChange();
        applyFilter();

        $("loading").style.display = "none";

        if (failed.length) {
            $("warning").style.display = "block";
            $("warning").textContent = "Some sheets could not be loaded:\n\n" + failed.join("\n\n");
        } else {
            $("success").style.display = "block";
        }
    } catch (e) {
        console.error("Dashboard Error:", e);
        $("loading").style.display = "none";
        $("error").style.display = "block";
        $("error").textContent = "Dashboard data load error:\n\n" + e.message;
    }
}

document.getElementById("periodSelect").addEventListener("change", handlePeriodChange);
document.getElementById("applyBtn").addEventListener("click", applyFilter);
loadDashboard();

/* =====================================================
   ITEM STOCK  (tab: "Item_Stock")
   - Header row = first row of STOCK_RANGE
   - Columns are found by heading name (Date, Item, Quantity, Unit, Amount)
   - If headings differ, set STOCK_COLUMNS manually (0 = first column of range)
===================================================== */
const STOCK_SHEET_NAME = "Item_Stock";
const STOCK_RANGE = "B3:Z";
const STOCK_COLUMNS = {};   // example: { date: 0, item: 1, qty: 2, unit: 3, amount: 4 }

let stockRecords = [];

const $id = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* Kg + Gram -> Kg ; Ltr + ML -> Ltr ; others stay as they are */
function normUnit(u) {
    const x = String(u || "").toLowerCase().replace(/[.\s]/g, "");
    if (/^(kg|kgs|kilo|kilos|kilogram|kilograms)$/.test(x)) return { unit: "Kg", factor: 1 };
    if (/^(g|gm|gms|gr|gram|grams)$/.test(x)) return { unit: "Kg", factor: 0.001 };
    if (/^(l|ltr|ltrs|liter|liters|litre|litres)$/.test(x)) return { unit: "Ltr", factor: 1 };
    if (/^(ml|mls|milliliter|millilitre)$/.test(x)) return { unit: "Ltr", factor: 0.001 };
    if (!x) return { unit: "", factor: 1 };
    return { unit: x.charAt(0).toUpperCase() + x.slice(1), factor: 1 };
}

const fmtQty = q => (Math.round(q * 1000) / 1000).toLocaleString("en-IN", { maximumFractionDigits: 3 });

async function loadStock() {
    const err = $id("stockError");
    try {
        err.style.display = "none";

        const rows = await loadSheetData(STOCK_SHEET_NAME, null, { sheet: STOCK_SHEET_NAME, range: STOCK_RANGE, headers: 1 });
        const labels = (rows.cols || []).map(c => String(c.label || "").trim().toLowerCase());

        const col = Object.assign({}, STOCK_COLUMNS);
        const used = new Set(Object.values(col));
        const find = (key, list) => {
            if (col[key] !== undefined) return;
            for (const re of list) {
                const i = labels.findIndex((l, idx) => !used.has(idx) && re.test(l));
                if (i >= 0) { col[key] = i; used.add(i); return; }
            }
        };
        /* Amount first, so "Item Wise Amount" is never mistaken for the Item column */
        find("amount", [/amount/, /total|cost|price|value/]);
        find("date",   [/date/]);
        find("item",   [/^item\s*(name)?$/, /^item(?!.*(amount|qty|quantity|price|unit|wise))/, /product|particular|description|name/]);
        find("qty",    [/qty|quantity/, /weight/]);
        find("unit",   [/^units?$|uom|unit of/]);

        const missing = ["date", "item", "qty", "amount"].filter(k => col[k] === undefined);
        if (missing.length) {
            throw new Error(
                "Item_Stock: could not find column(s): " + missing.join(", ") + ".\n" +
                "Headings found in row 3: " + (labels.filter(Boolean).join(" | ") || "(none)") + "\n" +
                "Fix: change STOCK_RANGE / STOCK_COLUMNS in the code."
            );
        }

        const names = ["date", "item", "qty", "unit", "amount"].filter(k => col[k] !== undefined)
            .map(k => k + " = " + (labels[col[k]] || "col " + (col[k] + 1)));
        $id("stockNote").textContent = "Columns used: " + names.join(", ") + ". Kg and Gram are added together in Kg.";

        stockRecords = [];

        rows.forEach(r => {
            if (!r || !r.c) return;
            const dc = r.c[col.date], ic = r.c[col.item];
            if (!dc || !ic) return;

            const d = parseDate(dc.v, dc.f);
            if (!d) return;

            const name = String(ic.v !== null && ic.v !== undefined ? ic.v : (ic.f || "")).trim();
            if (!name || /^select\b/i.test(name)) return;      // "Select" = no entry that day

            const qc = r.c[col.qty], ac = r.c[col.amount];
            const uc = col.unit !== undefined ? r.c[col.unit] : null;

            let unitText = uc ? String(uc.v !== null && uc.v !== undefined ? uc.v : (uc.f || "")) : "";
            let qty = 0;

            if (qc) {
                if (typeof qc.v === "number") qty = qc.v;
                else {
                    const m = String(qc.v !== null && qc.v !== undefined ? qc.v : (qc.f || "")).replace(/,/g, "").match(/^\s*(-?[\d.]+)\s*([a-zA-Z]*)/);
                    if (m) { qty = parseFloat(m[1]) || 0; if (!unitText) unitText = m[2]; }
                }
            }

            const nu = normUnit(unitText);

            stockRecords.push({
                date: dateOnly(d),
                key: name.toLowerCase(),
                item: name,
                qty: qty * nu.factor,
                unit: nu.unit,
                amount: ac ? parseAmount(ac.v) : 0
            });
        });

        /* item dropdown */
        const seen = new Map();
        stockRecords.forEach(r => { if (!seen.has(r.key)) seen.set(r.key, r.item); });
        const items = Array.from(seen.entries()).sort((a, b) => a[1].localeCompare(b[1]));
        $id("stockItem").innerHTML = '<option value="__all">All Items</option>' +
            items.map(it => '<option value="' + esc(it[0]) + '">' + esc(it[1]) + '</option>').join("");

        /* default dates */
        let latest = null;
        stockRecords.forEach(r => { if (!latest || r.date > latest) latest = r.date; });
        if (latest) {
            $id("stockFrom").value = inputDate(latest);
            $id("stockTo").value = inputDate(latest);
        }

        renderStock();

    } catch (e) {
        console.error("Stock Error:", e);
        err.style.display = "block";
        err.textContent = e.message;
        $id("stockSelected").innerHTML = "Selected period: <strong>—</strong>";
    }
}

function stockRange() {
    const sel = $id("stockPeriod").value;
    if (sel === "all") return { from: null, to: null, label: "All Dates" };

    let latest = null;
    stockRecords.forEach(r => { if (!latest || r.date > latest) latest = r.date; });
    if (!latest) throw new Error("No valid stock entry date was found.");

    if (sel === "lastDate")
        return { from: latest, to: latest, label: "Last Date Entry — " + showDate(latest) };

    if (sel === "last7" || sel === "last15") {
        const days = sel === "last7" ? 7 : 15;
        const from = new Date(latest);
        from.setDate(from.getDate() - (days - 1));
        return { from: dateOnly(from), to: latest, label: "Last " + days + " Days — " + showDate(from) + " to " + showDate(latest) };
    }

    const fv = $id("stockFrom").value, tv = $id("stockTo").value;
    if (!fv || !tv) throw new Error("Please select both From Date and To Date.");
    const f = fv.split("-").map(Number), t = tv.split("-").map(Number);
    const from = new Date(f[0], f[1] - 1, f[2]), to = new Date(t[0], t[1] - 1, t[2]);
    if (from > to) throw new Error("From Date cannot be later than To Date.");
    return { from, to, label: "Date Range — " + showDate(from) + " to " + showDate(to) };
}

function renderStock() {
    const err = $id("stockError");
    try {
        err.style.display = "none";

        const range = stockRange();
        const itemKey = $id("stockItem").value;
        const map = new Map();

        stockRecords.forEach(r => {
            if (range.from && (r.date < range.from || r.date > range.to)) return;
            if (itemKey !== "__all" && r.key !== itemKey) return;

            let it = map.get(r.key);
            if (!it) { it = { name: r.item, amount: 0, units: {} }; map.set(r.key, it); }
            it.amount += r.amount;
            it.units[r.unit] = (it.units[r.unit] || 0) + r.qty;
        });

        const list = Array.from(map.values()).sort((a, b) => a.name.localeCompare(b.name));

        $id("stockGrid").innerHTML = list.length
            ? list.map(it => {
                const qtyText = Object.keys(it.units).map(u => fmtQty(it.units[u]) + (u ? " " + u : "")).join(" + ");
                return '<div class="item-card">' +
                    '<div class="item-name">' + esc(it.name) + '</div>' +
                    '<div class="item-row"><span>Total Quantity</span><b class="num">' + esc(qtyText) + '</b></div>' +
                    '<div class="item-row amt"><span>Total Amount</span><b class="num">' + rupee(it.amount) + '</b></div>' +
                  '</div>';
              }).join("")
            : '<div class="stock-empty">No stock entries in this period.</div>';

        $id("stockSelected").innerHTML = "Selected period: <strong>" + esc(range.label) + "</strong>";

    } catch (e) {
        err.style.display = "block";
        err.textContent = e.message;
    }
}

$id("stockPeriod").addEventListener("change", () => {
    $id("stockDateRange").style.display = $id("stockPeriod").value === "range" ? "flex" : "none";
});
$id("stockApply").addEventListener("click", renderStock);
$id("stockItem").addEventListener("change", renderStock);

loadStock();
</script>
