<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stock Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: auto;
            padding: 25px;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            background: white;
            padding: 22px;
            border-radius: 14px;
            margin-bottom: 22px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .header p {
            color: #6b7280;
            font-size: 14px;
        }

        /* =========================
           MAIN CARDS
        ========================= */

        .main-kpis {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-bottom: 28px;
        }

        .main-card {
            padding: 25px;
            border-radius: 15px;
            min-height: 130px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .expense-card {
            background: #fff1f2;
            border: 1px solid #fecdd3;
        }

        .credit-card {
            background: #ecfdf5;
            border: 1px solid #bbf7d0;
        }

        .main-title {
            font-size: 15px;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .main-value {
            font-size: 32px;
            font-weight: bold;
        }

        /* =========================
           SECTION
        ========================= */

        .section-title {
            font-size: 20px;
            margin-bottom: 15px;
        }

        /* =========================
           KPI CARDS
        ========================= */

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
        }

        .kpi-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            min-height: 105px;

            box-shadow: 0 2px 9px rgba(0,0,0,0.06);
            border: 1px solid #e5e7eb;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .kpi-title {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 9px;
        }

        .kpi-value {
            font-size: 21px;
            font-weight: bold;
        }

        /* =========================
           STATUS
        ========================= */

        .loading {
            text-align: center;
            padding: 25px;
            color: #6b7280;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;

            padding: 15px;
            border-radius: 10px;

            margin-top: 20px;

            display: none;

            white-space: pre-line;
        }

        .success {
            text-align: center;
            padding: 12px;
            color: #15803d;
            font-size: 13px;
            display: none;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            margin-top: 30px;
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
        }

        /* =========================
           TABLET
        ========================= */

        @media (max-width: 1100px) {

            .kpi-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 650px) {

            .container {
                padding: 14px;
            }

            .header h1 {
                font-size: 23px;
            }

            .main-kpis {
                grid-template-columns: 1fr;
            }

            .main-value {
                font-size: 28px;
            }

            .kpi-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .kpi-card {
                padding: 13px;
                min-height: 90px;
            }

            .kpi-title {
                font-size: 12px;
            }

            .kpi-value {
                font-size: 18px;
            }
        }

        /* =========================
           VERY SMALL SCREEN
        ========================= */

        @media (max-width: 360px) {

            .kpi-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>


<body>

<div class="container">

    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <h1>Expense Dashboard</h1>

        <p>
            Live data from Google Sheets
        </p>

    </div>


    <!-- =========================
         MAIN KPI
    ========================= -->

    <div class="main-kpis">

        <div class="main-card expense-card">

            <div class="main-title">
                Total Expenditure
            </div>

            <div
                class="main-value"
                id="totalExpenditure"
            >
                ₹0
            </div>

        </div>


        <div class="main-card credit-card">

            <div class="main-title">
                Total Credit
            </div>

            <div
                class="main-value"
                id="totalCredit"
            >
                ₹0
            </div>

        </div>

    </div>


    <!-- =========================
         BREAKDOWN
    ========================= -->

    <div class="section-title">
        Expenditure Breakdown
    </div>


    <div class="kpi-grid">

        <div class="kpi-card">

            <div class="kpi-title">
                Total Buy
            </div>

            <div
                class="kpi-value"
                id="buying"
            >
                ₹0
            </div>

        </div>


        <div class="kpi-card">

            <div class="kpi-title">
                Employee
            </div>

            <div
                class="kpi-value"
                id="employee"
            >
                ₹0
            </div>

        </div>


        <div class="kpi-card">

            <div class="kpi-title">
                Cooking
            </div>

            <div
                class="kpi-value"
                id="cooking"
            >
                ₹0
            </div>

        </div>


        <div class="kpi-card">

            <div class="kpi-title">
                Miscellaneous
            </div>

            <div
                class="kpi-value"
                id="misc"
            >
                ₹0
            </div>

        </div>


        <div class="kpi-card">

            <div class="kpi-title">
                Supro Cars
            </div>

            <div
                class="kpi-value"
                id="supro"
            >
                ₹0
            </div>

        </div>


        <div class="kpi-card">

            <div class="kpi-title">
                Cash Credit
            </div>

            <div
                class="kpi-value"
                id="cashFlow"
            >
                ₹0
            </div>

        </div>

    </div>


    <!-- =========================
         STATUS
    ========================= -->

    <div
        id="loading"
        class="loading"
    >
        Loading data from Google Sheets...
    </div>


    <div
        id="success"
        class="success"
    >
        Data loaded successfully.
    </div>


    <div
        id="error"
        class="error"
    ></div>


    <div class="footer">
        Data is fetched directly from Google Sheets
    </div>

</div>



<script>

/* =========================================================
   1. GOOGLE SPREADSHEET ID
========================================================= */

const SPREADSHEET_ID =
    "1SXWgzfINs6TGt3G-AF25-O_TJq0xYsRPQns_P0x5xFs";


/* =========================================================
   2. SHEET CONFIGURATION
========================================================= */

const SHEETS = {

    Buying: {
        gid: "2093020950"
    },

    Cash_Flows: {
        gid: "2100593426"
    },

    Employee: {
        gid: "1620505158"
    },

    Cooking: {
        gid: "1987654808"
    },

    MISC: {
        gid: "1505058386"
    },

    Supro_Cars: {
        gid: "1580668395"
    }

};


/* =========================================================
   3. GLOBAL CALLBACK COUNTER
========================================================= */

let callbackCounter = 0;


/* =========================================================
   4. LOAD GOOGLE GVIZ DATA USING JSONP
========================================================= */

function loadSheetData(sheetName, gid) {

    return new Promise((resolve, reject) => {

        callbackCounter++;

        const callbackName =
            "gvizCallback_" +
            callbackCounter;


        /*
           Create global callback
        */

        window[callbackName] = function(response) {

            try {

                /*
                   Remove callback
                */

                delete window[callbackName];


                /*
                   Remove script
                */

                if (script.parentNode) {
                    script.parentNode.removeChild(script);
                }


                /*
                   Check response
                */

                if (!response) {

                    reject(
                        new Error(
                            sheetName +
                            ": Empty response from Google Sheets."
                        )
                    );

                    return;
                }


                /*
                   Check Google response status
                */

                if (
                    response.status &&
                    response.status !== "ok"
                ) {

                    let message =
                        sheetName +
                        ": Google Sheet returned an error.";

                    if (
                        response.errors &&
                        response.errors.length
                    ) {

                        message +=
                            "\n" +
                            response.errors
                                .map(
                                    e =>
                                        e.message ||
                                        e.detailed_message ||
                                        ""
                                )
                                .join("\n");
                    }

                    reject(
                        new Error(message)
                    );

                    return;
                }


                /*
                   Check table
                */

                if (
                    !response.table ||
                    !response.table.rows
                ) {

                    reject(
                        new Error(
                            sheetName +
                            ": No table data received."
                        )
                    );

                    return;
                }


                resolve(response.table);

            }

            catch (error) {

                reject(error);

            }

        };


        /*
           Build Google GViz URL

           headers=0 means we are reading the
           actual sheet rows exactly as they are.

           range=A1:Z means maximum 26 columns.
        */

        const params = new URLSearchParams();

        params.set(
            "gid",
            gid
        );

        params.set(
            "range",
            "A1:Z"
        );

        params.set(
            "headers",
            "0"
        );

        params.set(
            "tqx",
            "out:json;responseHandler:" +
            callbackName
        );


        const url =
            "https://docs.google.com/spreadsheets/d/" +
            SPREADSHEET_ID +
            "/gviz/tq?" +
            params.toString();


        /*
           Create script element.

           JSONP works through script loading,
           so browser CORS restrictions do not
           block this request.
        */

        const script =
            document.createElement("script");


        script.src = url;

        script.async = true;


        /*
           Error handling
        */

        script.onerror = function() {

            delete window[callbackName];

            if (script.parentNode) {
                script.parentNode.removeChild(script);
            }

            reject(
                new Error(
                    sheetName +
                    ": Could not access Google Sheet.\n" +
                    "Please check that the sheet is shared as " +
                    "\"Anyone with the link → Viewer\"."
                )
            );

        };


        /*
           Timeout protection
        */

        const timeout =
            setTimeout(() => {

                delete window[callbackName];

                if (script.parentNode) {
                    script.parentNode.removeChild(script);
                }

                reject(
                    new Error(
                        sheetName +
                        ": Google Sheets request timed out."
                    )
                );

            }, 15000);


        /*
           Wrap resolve/reject so timeout is cleared
        */

        const originalCallback =
            window[callbackName];


        window[callbackName] =
            function(response) {

                clearTimeout(timeout);

                originalCallback(response);

            };


        /*
           Add script to page
        */

        document.head.appendChild(script);

    });

}


/* =========================================================
   5. NORMALIZE HEADER
========================================================= */

function normalizeHeader(value) {

    return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "_");

}


/* =========================================================
   6. GET CELL VALUE
========================================================= */

function getCellValue(cell) {

    if (
        !cell ||
        cell.v === null ||
        cell.v === undefined
    ) {

        return "";

    }

    return cell.v;

}


/* =========================================================
   7. FIND DATE AND AMOUNT COLUMNS
========================================================= */

function findColumns(table, sheetName) {

    /*
       Row 3 = index 2

       Row 1 → index 0
       Row 2 → index 1
       Row 3 → index 2
    */

    if (
        !table.rows ||
        table.rows.length < 3
    ) {

        throw new Error(
            sheetName +
            ": Row 3 header was not found."
        );

    }


    const headerRow =
        table.rows[2];


    if (
        !headerRow ||
        !headerRow.c
    ) {

        throw new Error(
            sheetName +
            ": Header row is empty."
        );

    }


    let dateColumn = -1;

    let amountColumn = -1;


    headerRow.c.forEach(
        (cell, index) => {

            const value =
                normalizeHeader(
                    getCellValue(cell)
                );


            if (value === "date") {

                dateColumn = index;

            }


            if (value === "amount") {

                amountColumn = index;

            }

        }
    );


    if (dateColumn === -1) {

        throw new Error(
            sheetName +
            ": \"Date\" header not found in row 3."
        );

    }


    if (amountColumn === -1) {

        throw new Error(
            sheetName +
            ": \"Amount\" header not found in row 3."
        );

    }


    return {
        dateColumn,
        amountColumn
    };

}


/* =========================================================
   8. CONVERT AMOUNT TO NUMBER
========================================================= */

function amountToNumber(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return 0;

    }


    /*
       If Google returns a number,
       use it directly.
    */

    if (typeof value === "number") {

        return value;

    }


    /*
       If Google returns formatted text,
       remove currency symbols and commas.
    */

    const cleaned =
        String(value)
            .replace(/₹/g, "")
            .replace(/,/g, "")
            .trim();


    const number =
        Number(cleaned);


    if (
        Number.isNaN(number)
    ) {

        return 0;

    }


    return number;

}


/* =========================================================
   9. SUM ONE SHEET
========================================================= */

async function getSheetTotal(
    sheetName,
    gid
) {

    const table =
        await loadSheetData(
            sheetName,
            gid
        );


    const columns =
        findColumns(
            table,
            sheetName
        );


    let total = 0;


    /*
       Row 4 onward = data

       rows[0] → Row 1
       rows[1] → Row 2
       rows[2] → Row 3 Header
       rows[3] → Row 4 Data
    */

    for (
        let i = 3;
        i < table.rows.length;
        i++
    ) {

        const row =
            table.rows[i];


        if (
            !row ||
            !row.c
        ) {

            continue;

        }


        const amountCell =
            row.c[
                columns.amountColumn
            ];


        const value =
            getCellValue(
                amountCell
            );


        total +=
            amountToNumber(value);

    }


    return total;

}


/* =========================================================
   10. RUPEE FORMAT
========================================================= */

function formatRupee(value) {

    return "₹" +
        Number(value || 0)
            .toLocaleString(
                "en-IN",
                {
                    maximumFractionDigits: 2
                }
            );

}


/* =========================================================
   11. UPDATE HTML
========================================================= */

function updateDashboard(data) {

    const buying =
        data.Buying;

    const cashFlow =
        data.Cash_Flows;

    const employee =
        data.Employee;

    const cooking =
        data.Cooking;

    const misc =
        data.MISC;

    const supro =
        data.Supro_Cars;


    /*
       TOTAL EXPENDITURE

       Buying
       + Employee
       + Cooking
       + MISC
       + Supro Cars

       Cash Flow is NOT included.
    */

    const totalExpenditure =
        buying +
        employee +
        cooking +
        misc +
        supro;


    /*
       TOTAL CREDIT

       Only Cash_Flows
    */

    const totalCredit =
        cashFlow;


    /* =========================
       MAIN CARDS
    ========================= */

    document.getElementById(
        "totalExpenditure"
    ).textContent =
        formatRupee(
            totalExpenditure
        );


    document.getElementById(
        "totalCredit"
    ).textContent =
        formatRupee(
            totalCredit
        );


    /* =========================
       BREAKDOWN
    ========================= */

    document.getElementById(
        "buying"
    ).textContent =
        formatRupee(
            buying
        );


    document.getElementById(
        "employee"
    ).textContent =
        formatRupee(
            employee
        );


    document.getElementById(
        "cooking"
    ).textContent =
        formatRupee(
            cooking
        );


    document.getElementById(
        "misc"
    ).textContent =
        formatRupee(
            misc
        );


    document.getElementById(
        "supro"
    ).textContent =
        formatRupee(
            supro
        );


    document.getElementById(
        "cashFlow"
    ).textContent =
        formatRupee(
            cashFlow
        );

}


/* =========================================================
   12. LOAD ALL DATA
========================================================= */

async function loadDashboard() {

    const loading =
        document.getElementById(
            "loading"
        );


    const success =
        document.getElementById(
            "success"
        );


    const errorBox =
        document.getElementById(
            "error"
        );


    try {

        loading.style.display =
            "block";

        success.style.display =
            "none";

        errorBox.style.display =
            "none";


        /*
           Load all 6 tabs together.
        */

        const results =
            await Promise.all([

                getSheetTotal(
                    "Buying",
                    SHEETS.Buying.gid
                ),

                getSheetTotal(
                    "Cash_Flows",
                    SHEETS.Cash_Flows.gid
                ),

                getSheetTotal(
                    "Employee",
                    SHEETS.Employee.gid
                ),

                getSheetTotal(
                    "Cooking",
                    SHEETS.Cooking.gid
                ),

                getSheetTotal(
                    "MISC",
                    SHEETS.MISC.gid
                ),

                getSheetTotal(
                    "Supro_Cars",
                    SHEETS.Supro_Cars.gid
                )

            ]);


        /*
           Convert results into object.
        */

        const data = {

            Buying:
                results[0],

            Cash_Flows:
                results[1],

            Employee:
                results[2],

            Cooking:
                results[3],

            MISC:
                results[4],

            Supro_Cars:
                results[5]

        };


        /*
           Update dashboard.
        */

        updateDashboard(data);


        loading.style.display =
            "none";


        success.style.display =
            "block";


    }

    catch (error) {

        console.error(
            "Dashboard Error:",
            error
        );


        loading.style.display =
            "none";


        success.style.display =
            "none";


        errorBox.style.display =
            "block";


        errorBox.textContent =
            "Dashboard data load error:\n\n" +
            error.message;

    }

}


/* =========================================================
   13. START DASHBOARD
========================================================= */

loadDashboard();

</script>

</body>
</html>
