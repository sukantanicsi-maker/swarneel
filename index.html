<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: auto;
            padding: 25px;
        }

        .header {
            background: white;
            padding: 22px;
            border-radius: 14px;
            margin-bottom: 22px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .header p {
            color: #6b7280;
            font-size: 14px;
        }

        /* Main KPI */

        .main-kpis {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .main-card {
            padding: 25px;
            border-radius: 15px;
            min-height: 130px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .expense-card {
            background: #fff1f2;
            border: 1px solid #fecdd3;
        }

        .credit-card {
            background: #ecfdf5;
            border: 1px solid #bbf7d0;
        }

        .main-title {
            font-size: 15px;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .main-value {
            font-size: 32px;
            font-weight: bold;
        }

        /* Individual cards */

        .section-title {
            font-size: 20px;
            margin-bottom: 15px;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
        }

        .kpi-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            min-height: 105px;
            box-shadow: 0 2px 9px rgba(0,0,0,0.06);
            border: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .kpi-title {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 9px;
        }

        .kpi-value {
            font-size: 21px;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 25px;
            color: #6b7280;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            white-space: pre-line;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
        }

        /* Tablet */

        @media (max-width: 1100px) {

            .kpi-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* Mobile */

        @media (max-width: 650px) {

            .container {
                padding: 14px;
            }

            .header h1 {
                font-size: 23px;
            }

            .main-kpis {
                grid-template-columns: 1fr;
            }

            .main-value {
                font-size: 28px;
            }

            .kpi-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .kpi-card {
                padding: 13px;
                min-height: 90px;
            }

            .kpi-title {
                font-size: 12px;
            }

            .kpi-value {
                font-size: 18px;
            }
        }

        @media (max-width: 360px) {

            .kpi-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Expense Dashboard</h1>
        <p>Live data from Google Sheets</p>
    </div>

    <!-- Main KPI -->

    <div class="main-kpis">

        <div class="main-card expense-card">
            <div class="main-title">Total Expenditure</div>
            <div class="main-value" id="totalExpenditure">
                ₹0
            </div>
        </div>

        <div class="main-card credit-card">
            <div class="main-title">Total Credit</div>
            <div class="main-value" id="totalCredit">
                ₹0
            </div>
        </div>

    </div>

    <!-- Individual totals -->

    <div class="section-title">
        Expenditure Breakdown
    </div>

    <div class="kpi-grid">

        <div class="kpi-card">
            <div class="kpi-title">Total Buy</div>
            <div class="kpi-value" id="buying">₹0</div>
        </div>

        <div class="kpi-card">
            <div class="kpi-title">Employee</div>
            <div class="kpi-value" id="employee">₹0</div>
        </div>

        <div class="kpi-card">
            <div class="kpi-title">Cooking</div>
            <div class="kpi-value" id="cooking">₹0</div>
        </div>

        <div class="kpi-card">
            <div class="kpi-title">Miscellaneous</div>
            <div class="kpi-value" id="misc">₹0</div>
        </div>

        <div class="kpi-card">
            <div class="kpi-title">Supro Cars</div>
            <div class="kpi-value" id="supro">₹0</div>
        </div>

        <div class="kpi-card">
            <div class="kpi-title">Cash Credit</div>
            <div class="kpi-value" id="cashFlow">₹0</div>
        </div>

    </div>

    <div id="loading" class="loading">
        Loading data...
    </div>

    <div id="error" class="error"></div>

    <div class="footer">
        Data is fetched directly from Google Sheets
    </div>

</div>


<script>

/* =========================================================
   GOOGLE SPREADSHEET
========================================================= */

const SPREADSHEET_ID =
    "1SXWgzfINs6TGt3G-AF25-O_TJq0xYsRPQns_P0x5xFs";


/* =========================================================
   SHEET CONFIGURATION
========================================================= */

const SHEETS = {

    Buying: {
        gid: "2093020950"
    },

    Cash_Flows: {
        gid: "2100593426"
    },

    Employee: {
        gid: "1620505158"
    },

    Cooking: {
        gid: "1987654808"
    },

    MISC: {
        gid: "1505058386"
    },

    Supro_Cars: {
        gid: "1580668395"
    }

};


/* =========================================================
   GOOGLE GVIZ URL
========================================================= */

function getSheetURL(gid) {

    return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?gid=${gid}&range=A1:Z&headers=0`;
}


/* =========================================================
   GET CELL VALUE
========================================================= */

function getCellValue(cell) {

    if (!cell) {
        return "";
    }

    if (cell.v !== null && cell.v !== undefined) {
        return cell.v;
    }

    if (cell.f !== null && cell.f !== undefined) {
        return cell.f;
    }

    return "";
}


/* =========================================================
   NORMALIZE HEADER
========================================================= */

function normalizeHeader(value) {

    return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "_");
}


/* =========================================================
   FETCH ONE SHEET
========================================================= */

async function fetchSheet(sheetName, gid) {

    const url = getSheetURL(gid);

    const response = await fetch(url);

    if (!response.ok) {
        throw new Error(
            `${sheetName}: Unable to access Google Sheet`
        );
    }

    const text = await response.text();

    /*
       Google GViz returns JavaScript-like text:

       google.visualization.Query.setResponse({...});
    */

    const match = text.match(
        /google\.visualization\.Query\.setResponse\(([\s\S]+)\);/
    );

    if (!match) {

        throw new Error(
            `${sheetName}: Invalid Google Sheet response`
        );
    }

    const data = JSON.parse(match[1]);

    if (
        !data.table ||
        !data.table.rows
    ) {

        throw new Error(
            `${sheetName}: No data found`
        );
    }

    return data.table;
}


/* =========================================================
   FIND DATE + AMOUNT COLUMNS
========================================================= */

function findColumns(table, sheetName) {

    /*
       Header is always row 3.

       Array index:
       Row 1 = index 0
       Row 2 = index 1
       Row 3 = index 2
    */

    const headerRow = table.rows[2];

    if (!headerRow) {

        throw new Error(
            `${sheetName}: Header row 3 not found`
        );
    }

    const headers = headerRow.c || [];

    let dateColumn = -1;
    let amountColumn = -1;

    headers.forEach((cell, index) => {

        const value = normalizeHeader(
            getCellValue(cell)
        );

        if (value === "date") {
            dateColumn = index;
        }

        if (
            value === "amount"
        ) {
            amountColumn = index;
        }

    });


    if (dateColumn === -1) {

        throw new Error(
            `${sheetName}: Date column not found in row 3`
        );
    }


    if (amountColumn === -1) {

        throw new Error(
            `${sheetName}: Amount column not found in row 3`
        );
    }


    return {
        dateColumn,
        amountColumn
    };
}


/* =========================================================
   CONVERT AMOUNT TO NUMBER
========================================================= */

function amountToNumber(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return 0;
    }

    if (typeof value === "number") {
        return value;
    }

    /*
       Handles values like:

       5000
       ₹5000
       ₹ 5,000
       5,000
    */

    const cleaned = String(value)
        .replace(/₹/g, "")
        .replace(/,/g, "")
        .trim();

    const number = parseFloat(cleaned);

    return isNaN(number) ? 0 : number;
}


/* =========================================================
   SUM AMOUNT FROM SHEET
========================================================= */

async function getSheetTotal(sheetName, gid) {

    const table = await fetchSheet(
        sheetName,
        gid
    );

    const columns = findColumns(
        table,
        sheetName
    );

    let total = 0;


    /*
       Data starts from row 4.

       rows[0] = row 1
       rows[1] = row 2
       rows[2] = row 3 header
       rows[3] = row 4 first data row
    */

    for (
        let rowIndex = 3;
        rowIndex < table.rows.length;
        rowIndex++
    ) {

        const row = table.rows[rowIndex];

        if (!row || !row.c) {
            continue;
        }

        const amountCell =
            row.c[columns.amountColumn];

        const amount =
            getCellValue(amountCell);

        total += amountToNumber(amount);
    }


    return total;
}


/* =========================================================
   FORMAT RUPEE
========================================================= */

function formatRupee(value) {

    return "₹" + Number(value || 0)
        .toLocaleString("en-IN", {
            maximumFractionDigits: 2
        });
}


/* =========================================================
   LOAD DASHBOARD
========================================================= */

async function loadDashboard() {

    const loading =
        document.getElementById("loading");

    const error =
        document.getElementById("error");


    try {

        loading.style.display = "block";
        error.style.display = "none";


        /*
           Fetch all sheets simultaneously
        */

        const results =
            await Promise.all([

                getSheetTotal(
                    "Buying",
                    SHEETS.Buying.gid
                ),

                getSheetTotal(
                    "Cash_Flows",
                    SHEETS.Cash_Flows.gid
                ),

                getSheetTotal(
                    "Employee",
                    SHEETS.Employee.gid
                ),

                getSheetTotal(
                    "Cooking",
                    SHEETS.Cooking.gid
                ),

                getSheetTotal(
                    "MISC",
                    SHEETS.MISC.gid
                ),

                getSheetTotal(
                    "Supro_Cars",
                    SHEETS.Supro_Cars.gid
                )

            ]);


        /*
           Results order:

           0 = Buying
           1 = Cash_Flows
           2 = Employee
           3 = Cooking
           4 = MISC
           5 = Supro_Cars
        */

        const buying = results[0];

        const cashFlow = results[1];

        const employee = results[2];

        const cooking = results[3];

        const misc = results[4];

        const supro = results[5];


        /*
           TOTAL EXPENDITURE

           Buying
           + Employee
           + Cooking
           + MISC
           + Supro_Cars

           Cash_Flows is NOT included.
        */

        const totalExpenditure =
            buying +
            employee +
            cooking +
            misc +
            supro;


        /*
           TOTAL CREDIT

           Only Cash_Flows
        */

        const totalCredit =
            cashFlow;


        /* ==========================
           UPDATE MAIN CARDS
        ========================== */

        document.getElementById(
            "totalExpenditure"
        ).textContent =
            formatRupee(totalExpenditure);


        document.getElementById(
            "totalCredit"
        ).textContent =
            formatRupee(totalCredit);


        /* ==========================
           UPDATE INDIVIDUAL CARDS
        ========================== */

        document.getElementById(
            "buying"
        ).textContent =
            formatRupee(buying);


        document.getElementById(
            "employee"
        ).textContent =
            formatRupee(employee);


        document.getElementById(
            "cooking"
        ).textContent =
            formatRupee(cooking);


        document.getElementById(
            "misc"
        ).textContent =
            formatRupee(misc);


        document.getElementById(
            "supro"
        ).textContent =
            formatRupee(supro);


        document.getElementById(
            "cashFlow"
        ).textContent =
            formatRupee(cashFlow);


        loading.style.display = "none";


    } catch (err) {

        console.error(err);

        loading.style.display = "none";

        error.style.display = "block";

        error.textContent =
            "Dashboard data load error:\n\n" +
            err.message +
            "\n\nPlease check Google Sheet sharing permission and header names.";

    }

}


/* =========================================================
   START
========================================================= */

loadDashboard();

</script>

</body>
</html>
