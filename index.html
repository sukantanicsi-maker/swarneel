
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Expense Dashboard</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }


        .container {
            width: 100%;
            max-width: 1400px;
            margin: auto;
            padding: 25px;
        }


        /* ==========================
           HEADER
        ========================== */

        .header {
            background: white;
            padding: 22px;
            border-radius: 14px;
            margin-bottom: 20px;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.06);
        }


        .header h1 {
            font-size: 28px;
            margin-bottom: 6px;
        }


        .header p {
            color: #6b7280;
            font-size: 14px;
        }


        /* ==========================
           MAIN CARDS
        ========================== */

        .main-kpis {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;

            margin-bottom: 28px;
        }


        .main-card {

            padding: 25px;

            border-radius: 15px;

            min-height: 130px;

            display: flex;

            flex-direction: column;

            justify-content: center;
        }


        .expense-card {

            background: #fff1f2;

            border:
                1px solid #fecdd3;
        }


        .credit-card {

            background: #ecfdf5;

            border:
                1px solid #bbf7d0;
        }


        .main-title {

            font-size: 15px;

            color: #6b7280;

            margin-bottom: 10px;
        }


        .main-value {

            font-size: 32px;

            font-weight: bold;
        }


        /* ==========================
           SECTION
        ========================== */

        .section-title {

            font-size: 20px;

            margin-bottom: 15px;
        }


        /* ==========================
           KPI GRID
        ========================== */

        .kpi-grid {

            display: grid;

            grid-template-columns:
                repeat(6, 1fr);

            gap: 12px;
        }


        .kpi-card {

            background: white;

            border-radius: 12px;

            padding: 16px;

            min-height: 105px;

            border:
                1px solid #e5e7eb;

            box-shadow:
                0 2px 9px rgba(0,0,0,0.06);

            display: flex;

            flex-direction: column;

            justify-content: center;
        }


        .kpi-title {

            font-size: 13px;

            color: #6b7280;

            margin-bottom: 9px;
        }


        .kpi-value {

            font-size: 21px;

            font-weight: bold;
        }


        /* ==========================
           LOADING
        ========================== */

        .loading {

            text-align: center;

            padding: 25px;

            color: #6b7280;
        }


        /* ==========================
           ERROR
        ========================== */

        .error {

            background: #fee2e2;

            color: #991b1b;

            padding: 15px;

            border-radius: 10px;

            margin-top: 20px;

            display: none;

            white-space: pre-line;

            font-size: 14px;
        }


        /* ==========================
           SUCCESS
        ========================== */

        .success {

            text-align: center;

            color: #15803d;

            font-size: 13px;

            padding: 15px;

            display: none;
        }


        /* ==========================
           FOOTER
        ========================== */

        .footer {

            margin-top: 25px;

            text-align: center;

            color: #9ca3af;

            font-size: 12px;
        }


        /* ==========================
           TABLET
        ========================== */

        @media (max-width: 1100px) {

            .kpi-grid {

                grid-template-columns:
                    repeat(3, 1fr);
            }
        }


        /* ==========================
           MOBILE
        ========================== */

        @media (max-width: 650px) {

            .container {

                padding: 14px;
            }


            .header h1 {

                font-size: 23px;
            }


            .main-kpis {

                grid-template-columns:
                    1fr;
            }


            .main-value {

                font-size: 28px;
            }


            .kpi-grid {

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 10px;
            }


            .kpi-card {

                padding: 13px;

                min-height: 90px;
            }


            .kpi-title {

                font-size: 12px;
            }


            .kpi-value {

                font-size: 18px;
            }
        }


        /* ==========================
           VERY SMALL MOBILE
        ========================== */

        @media (max-width: 360px) {

            .kpi-grid {

                grid-template-columns:
                    1fr;
            }
        }

    </style>

</head>


<body>


<div class="container">


    <!-- ==========================
         HEADER
    ========================== -->

    <div class="header">

        <h1>
            Expense Dashboard
        </h1>

        <p>
            Live data from Google Sheets
        </p>

    </div>



    <!-- ==========================
         MAIN TOTALS
    ========================== -->

    <div class="main-kpis">


        <div class="main-card expense-card">

            <div class="main-title">
                Total Expenditure
            </div>

            <div
                class="main-value"
                id="totalExpenditure"
            >
                ₹0
            </div>

        </div>



        <div class="main-card credit-card">

            <div class="main-title">
                Total Credit
            </div>

            <div
                class="main-value"
                id="totalCredit"
            >
                ₹0
            </div>

        </div>


    </div>



    <!-- ==========================
         BREAKDOWN
    ========================== -->

    <div class="section-title">

        Expenditure Breakdown

    </div>


    <div class="kpi-grid">


        <!-- BUYING -->

        <div class="kpi-card">

            <div class="kpi-title">
                Total Buy
            </div>

            <div
                class="kpi-value"
                id="buying"
            >
                ₹0
            </div>

        </div>



        <!-- EMPLOYEE -->

        <div class="kpi-card">

            <div class="kpi-title">
                Employee
            </div>

            <div
                class="kpi-value"
                id="employee"
            >
                ₹0
            </div>

        </div>



        <!-- COOKING -->

        <div class="kpi-card">

            <div class="kpi-title">
                Cooking
            </div>

            <div
                class="kpi-value"
                id="cooking"
            >
                ₹0
            </div>

        </div>



        <!-- MISC -->

        <div class="kpi-card">

            <div class="kpi-title">
                Miscellaneous
            </div>

            <div
                class="kpi-value"
                id="misc"
            >
                ₹0
            </div>

        </div>



        <!-- SUPRO -->

        <div class="kpi-card">

            <div class="kpi-title">
                Supro Cars
            </div>

            <div
                class="kpi-value"
                id="supro"
            >
                ₹0
            </div>

        </div>



        <!-- CASH CREDIT -->

        <div class="kpi-card">

            <div class="kpi-title">
                Cash Credit
            </div>

            <div
                class="kpi-value"
                id="cashFlow"
            >
                ₹0
            </div>

        </div>


    </div>



    <!-- ==========================
         LOADING
    ========================== -->

    <div
        id="loading"
        class="loading"
    >

        Loading data from Google Sheets...

    </div>



    <!-- ==========================
         SUCCESS
    ========================== -->

    <div
        id="success"
        class="success"
    >

        Data loaded successfully.

    </div>



    <!-- ==========================
         ERROR
    ========================== -->

    <div
        id="error"
        class="error"
    ></div>



    <div class="footer">

        Data is fetched directly from Google Sheets

    </div>


</div>



<script>


/* =========================================================
   GOOGLE SPREADSHEET ID
========================================================= */

const SPREADSHEET_ID =
    "1SXWgzfINs6TGt3G-AF25-O_TJq0xYsRPQns_P0x5xFs";



/* =========================================================
   SHEET CONFIGURATION
=========================================================

   IMPORTANT:

   All six sheets have:

   Row 3 = Header
   Row 4 onward = Data
   Amount = Column D

   Therefore we directly read:

   D4:D

   We do NOT try to detect Date or Header.

========================================================= */

const SHEETS = {

    Buying: {
        gid: "2093020950",
        range: "D4:D"
    },

    Cash_Flows: {
        gid: "2100593426",
        range: "D4:D"
    },

    Employee: {
        gid: "1620505158",
        range: "D4:D"
    },

    Cooking: {
        gid: "1987654808",
        range: "D4:D"
    },

    MISC: {
        gid: "1505058386",
        range: "D4:D"
    },

    Supro_Cars: {
        gid: "1580668395",
        range: "D4:D"
    }

};



/* =========================================================
   CALLBACK COUNTER
========================================================= */

let callbackCounter = 0;



/* =========================================================
   LOAD ONE GOOGLE SHEET COLUMN
========================================================= */

function loadSheetAmount(
    sheetName,
    gid,
    range
) {

    return new Promise(
        (resolve, reject) => {


            callbackCounter++;


            const callbackName =
                "googleSheetCallback_" +
                callbackCounter;



            let finished = false;



            /* ==========================
               CLEANUP
            ========================== */

            function cleanup() {

                if (
                    window[callbackName]
                ) {

                    delete window[
                        callbackName
                    ];

                }


                if (
                    script &&
                    script.parentNode
                ) {

                    script.parentNode
                        .removeChild(script);

                }

            }



            /* ==========================
               SUCCESS
            ========================== */

            function finishSuccess(
                value
            ) {

                if (finished) {

                    return;

                }


                finished = true;

                clearTimeout(timeout);

                cleanup();

                resolve(value);

            }



            /* ==========================
               ERROR
            ========================== */

            function finishError(
                error
            ) {

                if (finished) {

                    return;

                }


                finished = true;

                clearTimeout(timeout);

                cleanup();

                reject(error);

            }



            /* ==========================
               GLOBAL CALLBACK
            ========================== */

            window[callbackName] =
                function(response) {


                    try {


                        if (!response) {

                            finishError(

                                new Error(
                                    sheetName +
                                    ": Empty response."
                                )

                            );

                            return;

                        }



                        /*
                           Google query error
                        */

                        if (
                            response.status &&
                            response.status !== "ok"
                        ) {

                            let message =
                                sheetName +
                                ": Google Sheets returned an error.";


                            if (
                                response.errors &&
                                response.errors.length
                            ) {

                                message +=
                                    "\n" +
                                    response.errors
                                        .map(
                                            e =>
                                                e.message ||
                                                e.detailed_message ||
                                                ""
                                        )
                                        .join(
                                            "\n"
                                        );

                            }


                            finishError(
                                new Error(
                                    message
                                )
                            );

                            return;

                        }



                        /*
                           Get rows
                        */

                        const rows =
                            response.table &&
                            response.table.rows
                                ? response.table.rows
                                : [];



                        let total = 0;



                        /*
                           Every returned row contains
                           one cell because we requested D4:D.
                        */

                        rows.forEach(
                            row => {


                                if (
                                    !row ||
                                    !row.c ||
                                    !row.c[0]
                                ) {

                                    return;

                                }



                                const cell =
                                    row.c[0];



                                let value =
                                    cell.v;



                                /*
                                   Number
                                */

                                if (
                                    typeof value ===
                                    "number"
                                ) {

                                    total += value;

                                    return;

                                }



                                /*
                                   Text number
                                */

                                if (
                                    value !==
                                    null &&
                                    value !==
                                    undefined &&
                                    value !== ""
                                ) {

                                    const cleaned =
                                        String(value)
                                            .replace(
                                                /₹/g,
                                                ""
                                            )
                                            .replace(
                                                /,/g,
                                                ""
                                            )
                                            .trim();


                                    const number =
                                        parseFloat(
                                            cleaned
                                        );


                                    if (
                                        !isNaN(number)
                                    ) {

                                        total +=
                                            number;

                                    }

                                }

                            }
                        );



                        finishSuccess(
                            total
                        );


                    }

                    catch (error) {

                        finishError(
                            error
                        );

                    }

                };



            /* ==========================
               GOOGLE GVIZ URL
            ========================== */

            const params =
                new URLSearchParams();


            params.set(
                "gid",
                gid
            );


            params.set(
                "range",
                range
            );


            params.set(
                "headers",
                "0"
            );


            params.set(
                "tqx",
                "out:json;responseHandler:" +
                callbackName
            );


            const url =
                "https://docs.google.com/spreadsheets/d/" +
                SPREADSHEET_ID +
                "/gviz/tq?" +
                params.toString();



            /* ==========================
               SCRIPT
            ========================== */

            const script =
                document.createElement(
                    "script"
                );


            script.src = url;

            script.async = true;



            /* ==========================
               NETWORK ERROR
            ========================== */

            script.onerror =
                function() {

                    finishError(

                        new Error(

                            sheetName +
                            ": Could not connect to Google Sheets.\n\n" +
                            "Please check Google Sheet sharing:\n" +
                            "Anyone with the link → Viewer"

                        )

                    );

                };



            /* ==========================
               TIMEOUT
            ========================== */

            const timeout =
                setTimeout(
                    function() {

                        finishError(

                            new Error(

                                sheetName +
                                ": Google Sheets request timed out."

                            )

                        );

                    },
                    20000
                );



            /* ==========================
               SEND REQUEST
            ========================== */

            document.head.appendChild(
                script
            );


        }
    );

}



/* =========================================================
   FORMAT RUPEE
========================================================= */

function formatRupee(
    value
) {

    return "₹" +
        Number(value || 0)
            .toLocaleString(
                "en-IN",
                {
                    maximumFractionDigits: 2
                }
            );

}



/* =========================================================
   UPDATE DASHBOARD
========================================================= */

function updateDashboard(
    values
) {


    /*
       EXPENDITURE

       Buying
       + Employee
       + Cooking
       + MISC
       + Supro Cars
    */

    const totalExpenditure =

        values.Buying +

        values.Employee +

        values.Cooking +

        values.MISC +

        values.Supro_Cars;



    /*
       CREDIT

       Only Cash_Flows
    */

    const totalCredit =
        values.Cash_Flows;



    /* ==========================
       MAIN TOTALS
    ========================== */

    document.getElementById(
        "totalExpenditure"
    ).textContent =

        formatRupee(
            totalExpenditure
        );



    document.getElementById(
        "totalCredit"
    ).textContent =

        formatRupee(
            totalCredit
        );



    /* ==========================
       INDIVIDUAL TOTALS
    ========================== */

    document.getElementById(
        "buying"
    ).textContent =

        formatRupee(
            values.Buying
        );



    document.getElementById(
        "employee"
    ).textContent =

        formatRupee(
            values.Employee
        );



    document.getElementById(
        "cooking"
    ).textContent =

        formatRupee(
            values.Cooking
        );



    document.getElementById(
        "misc"
    ).textContent =

        formatRupee(
            values.MISC
        );



    document.getElementById(
        "supro"
    ).textContent =

        formatRupee(
            values.Supro_Cars
        );



    document.getElementById(
        "cashFlow"
    ).textContent =

        formatRupee(
            values.Cash_Flows
        );

}



/* =========================================================
   LOAD ALL SIX SHEETS
========================================================= */

async function loadDashboard() {


    const loading =
        document.getElementById(
            "loading"
        );


    const success =
        document.getElementById(
            "success"
        );


    const errorBox =
        document.getElementById(
            "error"
        );


    try {


        loading.style.display =
            "block";


        success.style.display =
            "none";


        errorBox.style.display =
            "none";



        /*
           Load all six sheets.

           Each sheet is read independently.
        */

        const results =
            await Promise.all([


                loadSheetAmount(
                    "Buying",
                    SHEETS.Buying.gid,
                    SHEETS.Buying.range
                ),


                loadSheetAmount(
                    "Cash_Flows",
                    SHEETS.Cash_Flows.gid,
                    SHEETS.Cash_Flows.range
                ),


                loadSheetAmount(
                    "Employee",
                    SHEETS.Employee.gid,
                    SHEETS.Employee.range
                ),


                loadSheetAmount(
                    "Cooking",
                    SHEETS.Cooking.gid,
                    SHEETS.Cooking.range
                ),


                loadSheetAmount(
                    "MISC",
                    SHEETS.MISC.gid,
                    SHEETS.MISC.range
                ),


                loadSheetAmount(
                    "Supro_Cars",
                    SHEETS.Supro_Cars.gid,
                    SHEETS.Supro_Cars.range
                )

            ]);



        /*
           Store results.
        */

        const values = {


            Buying:
                results[0],


            Cash_Flows:
                results[1],


            Employee:
                results[2],


            Cooking:
                results[3],


            MISC:
                results[4],


            Supro_Cars:
                results[5]

        };



        /*
           Update dashboard.
        */

        updateDashboard(
            values
        );



        /*
           Hide loading.
        */

        loading.style.display =
            "none";


        /*
           Show success.
        */

        success.style.display =
            "block";


    }

    catch (error) {


        console.error(
            "Dashboard Error:",
            error
        );


        loading.style.display =
            "none";


        success.style.display =
            "none";


        errorBox.style.display =
            "block";


        errorBox.textContent =

            "Dashboard data load error:\n\n" +

            error.message;


    }

}



/* =========================================================
   START
========================================================= */

loadDashboard();


</script>


</body>

</html>
