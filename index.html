<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Stock Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- HEADER -->

    <header>

        <div>

            <h1>📊 Stock Dashboard</h1>

            <p>
                Google Sheet Based Stock Monitoring
            </p>

        </div>

        <div id="status">
            Loading data...
        </div>

    </header>


    <!-- SUMMARY CARDS -->

    <section class="cards">

        <div class="card purchase">

            <div class="icon">
                🛒
            </div>

            <div>

                <h3>Total Purchase</h3>

                <div id="totalPurchase"
                     class="value">

                    ₹0

                </div>

            </div>

        </div>


        <div class="card records">

            <div class="icon">
                📋
            </div>

            <div>

                <h3>Total Records</h3>

                <div id="totalRecords"
                     class="value">

                    0

                </div>

            </div>

        </div>

    </section>


    <!-- DATA TABLE -->

    <section class="table-section">

        <h2>Buy Stock Data</h2>

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Sl</th>
                        <th>Date</th>
                        <th>Category</th>
                        <th>Item Name</th>
                        <th>Quantity</th>
                        <th>Unit</th>
                        <th>Unit Cost</th>
                        <th>Total Cost</th>

                    </tr>

                </thead>


                <tbody id="tableBody">

                    <tr>

                        <td colspan="8">
                            Loading...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
