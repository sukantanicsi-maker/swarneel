<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Stock & Expense Dashboard</title>


<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    padding: 30px;
    background: #f4f6f9;
    color: #222;
}

.container {
    max-width: 1200px;
    margin: auto;
}

h1 {
    margin-bottom: 30px;
}


/* =========================
   DASHBOARD GRID
========================= */

.dashboard {

    display: grid;

    grid-template-columns:
    repeat(auto-fit, minmax(250px, 1fr));

    gap: 20px;
}


/* =========================
   CARD
========================= */

.card {

    background: white;

    padding: 25px;

    border-radius: 15px;

    box-shadow:
    0 4px 15px rgba(0,0,0,0.08);
}

.card-title {

    color: #777;

    font-size: 15px;

    margin-bottom: 12px;
}

.amount {

    font-size: 30px;

    font-weight: bold;

    color: #198754;
}


/* =========================
   GRAND TOTAL
========================= */

.grand-card {

    background: #212529;

    color: white;

    padding: 30px;

    margin-top: 25px;

    border-radius: 15px;

    box-shadow:
    0 4px 15px rgba(0,0,0,0.15);
}

.grand-title {

    font-size: 16px;

    margin-bottom: 12px;

    opacity: .8;
}

.grand-total {

    font-size: 38px;

    font-weight: bold;
}


/* =========================
   STATUS
========================= */

.status {

    margin-top: 25px;

    color: #666;

    font-size: 14px;
}


/* =========================
   BUTTON
========================= */

button {

    margin-top: 20px;

    padding: 11px 20px;

    border: none;

    border-radius: 8px;

    background: #0d6efd;

    color: white;

    font-size: 15px;

    cursor: pointer;
}

button:hover {

    background: #0b5ed7;
}

</style>

</head>


<body>


<div class="container">


<h1>
    Stock & Expense Dashboard
</h1>


<div class="dashboard">


<!-- BUYING -->

<div class="card">

    <div class="card-title">
        TOTAL BUY
    </div>

    <div
        class="amount"
        id="totalBuying">
        ₹0.00
    </div>

</div>


<!-- CASH FLOW -->

<div class="card">

    <div class="card-title">
        CASH CREDIT
    </div>

    <div
        class="amount"
        id="totalCashFlow">
        ₹0.00
    </div>

</div>


<!-- EMPLOYEE -->

<div class="card">

    <div class="card-title">
        EMPLOYEE
    </div>

    <div
        class="amount"
        id="totalEmployee">
        ₹0.00
    </div>

</div>


<!-- COOKING -->

<div class="card">

    <div class="card-title">
        COOKING
    </div>

    <div
        class="amount"
        id="totalCooking">
        ₹0.00
    </div>

</div>


<!-- MISC -->

<div class="card">

    <div class="card-title">
        MISCELLANEOUS
    </div>

    <div
        class="amount"
        id="totalMisc">
        ₹0.00
    </div>

</div>


<!-- SURPO CARS -->

<div class="card">

    <div class="card-title">
        SURPO CARS
    </div>

    <div
        class="amount"
        id="totalSurpoCars">
        ₹0.00
    </div>

</div>


</div>


<!-- GRAND TOTAL -->

<div class="grand-card">

    <div class="grand-title">
        GRAND TOTAL
    </div>

    <div
        class="grand-total"
        id="grandTotal">
        ₹0.00
    </div>

</div>


<div
    class="status"
    id="status">

    Loading data...

</div>


<button onclick="loadAllData()">

    Refresh Data

</button>


</div>



<script>


// =====================================================
// GOOGLE SPREADSHEET
// =====================================================

const SHEET_ID =
"1MSDmtDcmmKTt6ykUQh9XOnq0tfsipn2A";


// =====================================================
// SHEET + COLUMN CONFIGURATION
// =====================================================

const sources = [

    {
        sheet: "Buying",
        column: "Buying_Price",
        element: "totalBuying"
    },

    {
        sheet: "Cash_Flows",
        column: "Amount_Credit",
        element: "totalCashFlow"
    },

    {
        sheet: "Employee",
        column: "Amount",
        element: "totalEmployee"
    },

    {
        sheet: "Cooking",
        column: "Amount",
        element: "totalCooking"
    },

    {
        sheet: "MISC",
        column: "Amount",
        element: "totalMisc"
    },

    {
        sheet: "Surpo_Cars",
        column: "Amount",
        element: "totalSurpoCars"
    }

];



// =====================================================
// FORMAT MONEY
// =====================================================

function formatMoney(value) {

    return "₹" +
        value.toLocaleString(
            "en-IN",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );

}



// =====================================================
// GET TOTAL FROM GOOGLE SHEET
// =====================================================

async function getSheetTotal(
    sheetName,
    columnName
) {


    const url =

        "https://docs.google.com/spreadsheets/d/" +

        SHEET_ID +

        "/gviz/tq?tqx=out:json&sheet=" +

        encodeURIComponent(sheetName);


    const response =
        await fetch(url);


    if (!response.ok) {

        throw new Error(
            "Unable to access " +
            sheetName
        );

    }


    const text =
        await response.text();


    // Google JSON wrapper remove

    const start =
        text.indexOf("{");


    const end =
        text.lastIndexOf("}") + 1;


    const jsonText =
        text.substring(
            start,
            end
        );


    const data =
        JSON.parse(jsonText);


    const columns =
        data.table.cols;


    const rows =
        data.table.rows;


    // =================================================
    // FIND COLUMN
    // =================================================

    let columnIndex = -1;


    for (
        let i = 0;
        i < columns.length;
        i++
    ) {


        const label =
            (
                columns[i].label || ""
            ).trim();


        if (
            label.toLowerCase() ===
            columnName.toLowerCase()
        ) {

            columnIndex = i;

            break;

        }

    }


    if (columnIndex === -1) {

        throw new Error(

            columnName +
            " column not found in " +
            sheetName

        );

    }


    // =================================================
    // TOTAL
    // =================================================

    let total = 0;


    rows.forEach(row => {


        if (
            !row.c ||
            !row.c[columnIndex]
        ) {

            return;

        }


        let value =
            row.c[columnIndex].v;


        if (
            value === null ||
            value === undefined
        ) {

            return;

        }


        value =
            String(value);


        // Remove currency symbols,
        // commas and spaces

        value =
            value.replace(
                /[₹,$\s]/g,
                ""
            );


        const number =
            parseFloat(value);


        if (!isNaN(number)) {

            total += number;

        }

    });


    return total;

}



// =====================================================
// LOAD ALL DATA
// =====================================================

async function loadAllData() {


    const status =
        document.getElementById(
            "status"
        );


    status.innerText =
        "Loading data from Google Sheets...";


    let grandTotal = 0;


    try {


        // =============================================
        // LOAD ALL 6 SHEETS
        // =============================================

        for (
            const source of sources
        ) {


            const total =
                await getSheetTotal(
                    source.sheet,
                    source.column
                );


            // Show individual total

            document.getElementById(
                source.element
            ).innerText =
                formatMoney(total);


            // Add to grand total

            grandTotal += total;

        }


        // =============================================
        // SHOW GRAND TOTAL
        // =============================================

        document.getElementById(
            "grandTotal"
        ).innerText =
            formatMoney(grandTotal);


        status.innerText =
            "All data updated successfully.";


    }
    catch (error) {


        console.error(error);


        status.innerText =
            "Error: " +
            error.message;


    }

}



// =====================================================
// AUTO LOAD
// =====================================================

loadAllData();


</script>


</body>

</html>
