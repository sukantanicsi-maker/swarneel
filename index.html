<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Stock Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f9;
      padding: 30px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      margin-bottom: 25px;
      color: #222;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .card-title {
      color: #777;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .amount {
      font-size: 32px;
      font-weight: bold;
      color: #198754;
    }

    .status {
      margin-top: 25px;
      color: #666;
      font-size: 14px;
    }

    button {
      margin-top: 20px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #0d6efd;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #0b5ed7;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Stock Dashboard</h1>

    <div class="dashboard">

      <div class="card">

        <div class="card-title">
          TOTAL BUY
        </div>

        <div class="amount" id="totalBuy">
          ₹0.00
        </div>

      </div>

    </div>

    <div class="status" id="status">
      Loading data...
    </div>

    <button onclick="loadData()">
      Refresh Data
    </button>

  </div>


  <script>

    // ==========================================
    // GOOGLE SHEET SETTINGS
    // ==========================================

    const SHEET_ID =
      "1MSDmtDcmmKTt6ykUQh9XOnq0tfsipn2A";

    const SHEET_NAME =
      "Buying";

    const AMOUNT_COLUMN =
      "Buying_Price";


    // ==========================================
    // LOAD DATA FROM GOOGLE SHEET
    // ==========================================

    async function loadData() {

      const status =
        document.getElementById("status");

      status.innerText =
        "Loading data...";

      try {

        const url =
          `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;

        const response =
          await fetch(url);

        if (!response.ok) {
          throw new Error("Google Sheet could not be accessed.");
        }

        const text =
          await response.text();


        // Google Sheets JSON wrapper remove
        const jsonText =
          text.substring(
            text.indexOf("{"),
            text.lastIndexOf("}") + 1
          );


        const data =
          JSON.parse(jsonText);


        const columns =
          data.table.cols;

        const rows =
          data.table.rows;


        // ==========================================
        // FIND Buying_Price COLUMN
        // ==========================================

        let amountColumn = -1;

        columns.forEach((column, index) => {

          if (
            column.label &&
            column.label.trim().toLowerCase() ===
            AMOUNT_COLUMN.toLowerCase()
          ) {

            amountColumn = index;

          }

        });


        // ==========================================
        // COLUMN NOT FOUND
        // ==========================================

        if (amountColumn === -1) {

          status.innerText =
            "ERROR: Buying_Price column not found.";

          console.error(
            "Available columns:",
            columns.map(c => c.label)
          );

          return;
        }


        // ==========================================
        // CALCULATE TOTAL BUY
        // ==========================================

        let totalBuy = 0;


        rows.forEach(row => {

          if (
            !row.c ||
            !row.c[amountColumn]
          ) {
            return;
          }


          let value =
            row.c[amountColumn].v;


          // Convert to string
          value =
            String(value);


          // Remove ₹, commas and spaces
          value =
            value.replace(
              /[₹,\s]/g,
              ""
            );


          const amount =
            parseFloat(value);


          if (!isNaN(amount)) {

            totalBuy += amount;

          }

        });


        // ==========================================
        // DISPLAY TOTAL
        // ==========================================

        document.getElementById(
          "totalBuy"
        ).innerText =
          "₹" +
          totalBuy.toLocaleString(
            "en-IN",
            {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2
            }
          );


        status.innerText =
          "Data updated successfully.";


      } catch (error) {

        console.error(error);

        status.innerText =
          "Unable to load Google Sheet data. Please check the Sheet sharing permission.";

      }

    }


    // ==========================================
    // LOAD DATA WHEN PAGE OPENS
    // ==========================================

    loadData();

  </script>

</body>
</html>
