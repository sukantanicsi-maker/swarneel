<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Stock Dashboard</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    padding: 30px;
    background: #f4f6f9;
    color: #222;
}

.container {
    max-width: 1200px;
    margin: auto;
}

h1 {
    margin-bottom: 30px;
    font-size: 28px;
}


/* =========================
   DASHBOARD GRID
========================= */

.dashboard {

    display: grid;

    grid-template-columns:
    repeat(auto-fit, minmax(250px, 1fr));

    gap: 20px;
}


/* =========================
   CARDS
========================= */

.card {

    background: white;

    padding: 25px;

    border-radius: 15px;

    box-shadow:
    0 4px 15px rgba(0,0,0,0.08);

    transition: 0.2s;
}

.card:hover {

    transform: translateY(-2px);

    box-shadow:
    0 6px 20px rgba(0,0,0,0.12);
}

.card-title {

    color: #777;

    font-size: 15px;

    margin-bottom: 12px;

    text-transform: uppercase;
}

.amount {

    font-size: 30px;

    font-weight: bold;

    color: #198754;
}


/* =========================
   GRAND TOTAL
========================= */

.grand-card {

    background: #212529;

    color: white;

    padding: 30px;

    margin-top: 25px;

    border-radius: 15px;

    box-shadow:
    0 4px 15px rgba(0,0,0,0.15);
}

.grand-title {

    font-size: 16px;

    margin-bottom: 12px;

    opacity: 0.8;

    text-transform: uppercase;
}

.grand-total {

    font-size: 40px;

    font-weight: bold;
}


/* =========================
   STATUS
========================= */

.status {

    margin-top: 25px;

    color: #666;

    font-size: 14px;
}


/* =========================
   REFRESH BUTTON
========================= */

button {

    margin-top: 20px;

    padding: 11px 20px;

    border: none;

    border-radius: 8px;

    background: #0d6efd;

    color: white;

    font-size: 15px;

    cursor: pointer;
}

button:hover {

    background: #0b5ed7;
}

</style>

</head>


<body>


<div class="container">


<h1>
    Stock & Expense Dashboard
</h1>


<!-- =========================
     DASHBOARD CARDS
========================= -->

<div class="dashboard">


    <!-- BUYING -->

    <div class="card">

        <div class="card-title">
            Total Buy
        </div>

        <div
            class="amount"
            id="totalBuying">

            ₹0.00

        </div>

    </div>


    <!-- CASH FLOW -->

    <div class="card">

        <div class="card-title">
            Cash Credit
        </div>

        <div
            class="amount"
            id="totalCashFlow">

            ₹0.00

        </div>

    </div>


    <!-- EMPLOYEE -->

    <div class="card">

        <div class="card-title">
            Employee
        </div>

        <div
            class="amount"
            id="totalEmployee">

            ₹0.00

        </div>

    </div>


    <!-- COOKING -->

    <div class="card">

        <div class="card-title">
            Cooking
        </div>

        <div
            class="amount"
            id="totalCooking">

            ₹0.00

        </div>

    </div>


    <!-- MISC -->

    <div class="card">

        <div class="card-title">
            Miscellaneous
        </div>

        <div
            class="amount"
            id="totalMisc">

            ₹0.00

        </div>

    </div>


    <!-- SUPRO CARS -->

    <div class="card">

        <div class="card-title">
            Supro Cars
        </div>

        <div
            class="amount"
            id="totalSuproCars">

            ₹0.00

        </div>

    </div>


</div>


<!-- =========================
     GRAND TOTAL
========================= -->

<div class="grand-card">

    <div class="grand-title">
        Grand Total
    </div>

    <div
        class="grand-total"
        id="grandTotal">

        ₹0.00

    </div>

</div>


<!-- STATUS -->

<div
    class="status"
    id="status">

    Loading data from Google Sheets...

</div>


<!-- REFRESH -->

<button onclick="loadAllData()">

    Refresh Data

</button>


</div>



<script>


// =====================================================
// GOOGLE SPREADSHEET ID
// =====================================================

const SHEET_ID =
"1MSDmtDcmmKTt6ykUQh9XOnq0tfsipn2A";


// =====================================================
// SHEET + COLUMN CONFIGURATION
// =====================================================

const sources = [

    {
        sheet: "Buying",
        column: "Buying_Price",
        element: "totalBuying"
    },

    {
        sheet: "Cash_Flows",
        column: "Amount_Credit",
        element: "totalCashFlow"
    },

    {
        sheet: "Employee",
        column: "Amount",
        element: "totalEmployee"
    },

    {
        sheet: "Cooking",
        column: "Amount",
        element: "totalCooking"
    },

    {
        sheet: "MISC",
        column: "Amount",
        element: "totalMisc"
    },

    {
        sheet: "Supro_Cars",
        column: "Amount",
        element: "totalSuproCars"
    }

];


// =====================================================
// FORMAT CURRENCY
// =====================================================

function formatMoney(value) {

    return "₹" +

        value.toLocaleString(
            "en-IN",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );

}


// =====================================================
// GET TOTAL FROM ONE GOOGLE SHEET
// =====================================================

async function getSheetTotal(
    sheetName,
    columnName
) {

    const url =

        "https://docs.google.com/spreadsheets/d/" +

        SHEET_ID +

        "/gviz/tq?tqx=out:json&sheet=" +

        encodeURIComponent(sheetName);


    const response =
        await fetch(url);


    if (!response.ok) {

        throw new Error(
            "Cannot access sheet: " +
            sheetName
        );

    }


    const text =
        await response.text();


    // ---------------------------------------------
    // Convert Google GViz response to JSON
    // ---------------------------------------------

    const start =
        text.indexOf("{");

    const end =
        text.lastIndexOf("}") + 1;

    const jsonText =
        text.substring(
            start,
            end
        );

    const data =
        JSON.parse(jsonText);


    const columns =
        data.table.cols;

    const rows =
        data.table.rows;


    // ---------------------------------------------
    // FIND COLUMN INDEX
    // ---------------------------------------------

    let columnIndex = -1;


    for (
        let i = 0;
        i < columns.length;
        i++
    ) {

        const label =
            (
                columns[i].label || ""
            ).trim();


        if (
            label.toLowerCase() ===
            columnName.toLowerCase()
        ) {

            columnIndex = i;

            break;

        }

    }


    // ---------------------------------------------
    // COLUMN NOT FOUND
    // ---------------------------------------------

    if (columnIndex === -1) {

        throw new Error(

            "'" +
            columnName +
            "' not found in '" +
            sheetName +
            "' sheet."

        );

    }


    // ---------------------------------------------
    // CALCULATE TOTAL
    // ---------------------------------------------

    let total = 0;


    rows.forEach(row => {

        if (
            !row.c ||
            !row.c[columnIndex]
        ) {
            return;
        }


        let value =
            row.c[columnIndex].v;


        if (
            value === null ||
            value === undefined
        ) {
            return;
        }


        // Convert to string

        value =
            String(value);


        // Remove:
        // ₹
        // $
        // comma
        // spaces

        value =
            value.replace(
                /[₹,$\s]/g,
                ""
            );


        const number =
            parseFloat(value);


        if (!isNaN(number)) {

            total += number;

        }

    });


    return total;

}


// =====================================================
// LOAD ALL 6 SHEETS
// =====================================================

async function loadAllData() {


    const status =
        document.getElementById(
            "status"
        );


    status.innerText =
        "Loading data...";


    let grandTotal = 0;


    try {


        // ---------------------------------------------
        // PROCESS ALL SOURCES
        // ---------------------------------------------

        for (
            const source of sources
        ) {


            const total =
                await getSheetTotal(
                    source.sheet,
                    source.column
                );


            // Show individual total

            document.getElementById(
                source.element
            ).innerText =
                formatMoney(total);


            // Add to Grand Total

            grandTotal += total;

        }


        // ---------------------------------------------
        // SHOW GRAND TOTAL
        // ---------------------------------------------

        document.getElementById(
            "grandTotal"
        ).innerText =
            formatMoney(grandTotal);


        status.innerText =
            "All data updated successfully.";


    }
    catch (error) {


        console.error(error);


        status.innerText =
            "Error: " +
            error.message;


    }

}


// =====================================================
// LOAD DATA WHEN PAGE OPENS
// =====================================================

loadAllData();


</script>


</body>

</html>
